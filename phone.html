<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ne raccroche pas — téléphone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--fg:#eee;--dim:#8a8a90;--green:#34c759;--red:#ff3b30;--accent:#f3e2b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center}
.screen.show{display:flex}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:22px;color:#cfc8b8}
h1 em{font-style:normal;color:#b3261e}
p{color:var(--dim);line-height:1.5;font-size:16px;max-width:30em}
.btn{appearance:none;border:none;font:inherit;color:#000;background:var(--accent);border-radius:999px;padding:18px 34px;font-size:18px;font-weight:600;margin-top:28px}
.btn:active{transform:scale(.97)}
#err{color:#ff8a80;font-size:14px;margin-top:16px;min-height:1.4em}
/* écran de jeu */
#game{justify-content:space-between}
#top{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
#top .dot{width:8px;height:8px;border-radius:50%;background:#444;margin-right:10px}
#top .dot.on{background:var(--green)}
#mid{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#msg{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:3;font-size:19px;color:#000;background:var(--accent);border-radius:999px;padding:14px 26px;white-space:nowrap;opacity:0;transition:opacity .3s;letter-spacing:.02em;box-shadow:0 0 40px rgba(243,226,184,.35)}
#msg.show{opacity:1;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
#call{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at top,#1d1d22,#000 70%)}
#call.show{display:flex}
#call .av{width:96px;height:96px;border-radius:50%;background:#2b2b30;display:flex;align-items:center;justify-content:center;font-size:40px;color:#bbb;margin-bottom:8px}
#call .name{font-size:32px;font-weight:500}
#call .st{color:var(--dim);font-size:16px;min-height:1.4em}
#call .line{color:#cfcfd4;font-size:15px;max-width:26em;line-height:1.45;min-height:3em;margin-top:8px;padding:0 12px}
#call .acts{display:flex;gap:54px;margin-top:40px}
#call .act button{display:flex;align-items:center;justify-content:center}
#call .act{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:13px}
#call .act button{width:78px;height:78px;border-radius:50%;border:none;font-size:34px;color:#fff}
#call .act .a{background:var(--green)}#call .act .d{background:var(--red)}
#call.active .acts{display:none}
#call.ring .av{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}50%{transform:rotate(0)}}
#bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}
#torch{width:110px;height:110px;border-radius:50%;border:2px solid #333;background:#0d0d0f;display:flex;align-items:center;justify-content:center;font-size:44px;transition:background .2s,border-color .2s,box-shadow .2s}
#torch.on{background:#f3e2b8;border-color:#fff;box-shadow:0 0 60px rgba(243,226,184,.6)}
#torch.hl{animation:hl 1s ease-in-out infinite}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 rgba(243,226,184,.0)}50%{box-shadow:0 0 0 14px rgba(243,226,184,.35)}}
#torchl{color:var(--dim);font-size:13px;letter-spacing:.2em;text-transform:uppercase;min-height:1.2em}
#choice{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.92);padding:24px;z-index:5}
#choice.show{display:flex}
#choice button{width:100%;max-width:360px;padding:22px;border-radius:18px;border:1px solid #444;background:#111;color:#fff;font:inherit;font-size:20px}
#choice button:active{background:#222}
#sms{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));background:#1c1c1e;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2);z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#sms.show{transform:translateY(0)}
#sms .ic{width:36px;height:36px;border-radius:9px;background:var(--green);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
#sms .from{font-weight:600;font-size:15px}#sms .txt{font-size:15px;color:#ddd;margin-top:2px;line-height:1.35}
#sms .when{margin-left:auto;color:var(--dim);font-size:12px;flex:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#pulse{position:absolute;inset:0;pointer-events:none;z-index:8;box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}
#pulse.on{animation:pulse .18s ease-out}
@keyframes pulse{0%{box-shadow:inset 0 0 40px 10px rgba(255,255,255,.55)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}
#log{position:absolute;inset:0;background:#000;display:none;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 20px;z-index:7;text-align:left}
#log.show{display:flex}
#log h3{font-size:30px;font-weight:700;margin:20px 0 10px}
#log .row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1c1c1e;font-size:17px}
#log .row small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
#log .row .r{color:var(--dim);font-size:14px}
#log .row.x{color:var(--red)}
#log .fin{margin-top:auto;text-align:center;color:var(--dim);letter-spacing:.4em;text-transform:uppercase;font-size:13px;padding:20px}
#disc{position:absolute;left:0;right:0;bottom:0;background:#3a1010;color:#fbb;padding:10px;font-size:13px;text-align:center;display:none;z-index:6}
#disc.show{display:block}
</style>
</head>
<body>
<div id="setup" class="screen show">
  <h1>Ne <em>raccroche</em> pas</h1>
  <p style="margin-top:14px">Ce téléphone est ta lampe torche.<br>Mets le son à fond, et garde-le dans ta main.</p>
  <button class="btn" id="go">Activer la lampe</button>
  <div id="err"></div>
</div>
<div id="calib" class="screen">
  <p style="font-size:18px;color:#ddd">Tiens le téléphone comme une lampe, pointé vers l'écran.</p>
  <p style="margin-top:10px">Puis touche l'écran pour caler la visée.</p>
</div>
<div id="game" class="screen">
  <div id="top"><span class="dot" id="dot"></span><span id="topt">Connecté</span></div>
  <div id="mid">
    <div id="msg"></div>
    <div id="call">
      <div class="av">☏</div>
      <div class="name"></div>
      <div class="st"></div>
      <div class="line"></div>
      <div class="acts">
        <div class="act decline"><button class="d" id="decl" aria-label="Refuser"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span>Refuser</span></div>
        <div class="act answer"><button class="a" id="ans" aria-label="Répondre"><svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg></button><span>Répondre</span></div>
      </div>
    </div>
  </div>
  <div id="bottom"><div id="torch">🔦</div><div id="torchl">Lampe</div></div>
</div>
<div id="choice"></div>
<div id="sms"><div class="ic">✉︎</div><div><div class="from"></div><div class="txt"></div></div><div class="when">maintenant</div></div>
<div id="log"></div>
<div id="pulse"></div>
<div id="flash"></div>
<div id="disc">Connexion perdue — reconnexion…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="js/phone.js"></script>
</body>
</html>
